  socket_io_client: ^3.1.6
  firebase_core: ^4.13.0
  firebase_messaging: ^16.5.0
  flutter_local_notifications: ^20.1.0
  google_fonts: ^6.3.2
  lucide_icons: ^0.257.0
  image_picker: ^1.1.2
  share_plus: ^10.1.4
  flutter_svg: ^2.2.0
  app_badge_plus: ^1.3.4

dev_dependencies:
