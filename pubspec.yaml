name: mock_mobile
description: Edumimi mock exam practice — native mobile client.
publish_to: 'none'
version: 1.0.0+4

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  collection: ^1.19.1
  dio: ^5.8.0+1
  equatable: ^2.0.7
  flutter_riverpod: ^2.6.1
  flutter_secure_storage: ^9.2.4
  go_router: ^15.1.2
  app_links: ^6.4.1
  intl: ^0.20.2
  connectivity_plus: ^6.1.4
